services:
  postgres:
    image: postgres:15
    container_name: fice-postgres
    restart: always
    environment:
      POSTGRES_DB: fice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - fice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fice"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fice-server
    restart: always
    environment:
      # `postgres` is the service name on the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fice?schema=public
      PORT: 3001
      TZ: Europe/Kyiv
      # Optional Telegram admin config — taken from your shell or a root .env if set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      # Only members of this Telegram group may change content.
      ADMIN_GROUP_CHAT_ID: ${ADMIN_GROUP_CHAT_ID:-}
      # Channel the bot posts announcements to (bot must be its admin).
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      # Partnerships chat — partner applications are sent here. For a forum
      # topic (гілка) use "chatId/threadId", e.g. -1001234567890/12.
      PARTNERSHIP_CHAT_ID: ${PARTNERSHIP_CHAT_ID:-}
      # Project chat the bot harvests participants from. For a forum topic use
      # "chatId/threadId" (only messages in that topic are harvested).
      PROJECT_CHAT_ID: ${PROJECT_CHAT_ID:-}
      # Public origin of the web site, used to build event registration links.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      # Telegram usernames pinged on a new partner application.
      PARTNERSHIP_HEAD_TG: ${PARTNERSHIP_HEAD_TG:-}
      COUNCIL_HEAD_TG: ${COUNCIL_HEAD_TG:-}
      # Set to "true" to open write endpoints without Telegram auth (dev only).
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Optional Monobank jar token for auto-syncing collected amounts/donations.
      MONOBANK_TOKEN: ${MONOBANK_TOKEN:-}
      # Where uploaded images are stored inside the container (persisted via volume).
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - fice_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://server:3001
    container_name: fice-admin
    restart: always
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Kyiv
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # The /api-proxy rewrite runs inside this container, so it must reach the
      # backend via the compose service name — `localhost` would be the admin
      # container itself.
      BACKEND_URL: http://server:3001
    depends_on:
      - server

  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile
    container_name: fice-web
    restart: always
    ports:
      - "3002:3000"
    environment:
      TZ: Europe/Kyiv
      # Public URL the browser uses (images, client-side calls).
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Internal URL for server-side (SSR/RSC) data fetches on the compose network.
      INTERNAL_API_URL: http://server:3001
    depends_on:
      - server

volumes:
  fice_pg_data:
  fice_uploads:
