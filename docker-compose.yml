x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:15
    container_name: fice-postgres
    logging: *default-logging
    mem_limit: 2g
    restart: always
    environment:
      POSTGRES_DB: fice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fice"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: fice-web-server:latest
    pull_policy: never
    container_name: fice-migrate
    logging: *default-logging
    mem_limit: 512m
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env}@postgres:5432/fice?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: fice-web-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
      secrets:
        - postgres_password
    container_name: fice-server
    logging: *default-logging
    mem_limit: 1g
    restart: always
    environment:
      # `postgres` is the service name on the compose network.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env}@postgres:5432/fice?schema=public
      PORT: 3001
      NODE_OPTIONS: --max-old-space-size=640
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TZ: Europe/Kyiv
      # Optional Telegram admin config — taken from your shell or a root .env if set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      # User Bot Token for students and registration Mini App
      USER_BOT_TOKEN: ${USER_BOT_TOKEN:-}
      USER_BOT_USERNAME: ${USER_BOT_USERNAME:-}
      USER_MINI_APP_NAME: ${USER_MINI_APP_NAME:-app}
      USER_MINI_APP_URL: ${USER_MINI_APP_URL:-}
      # Only members of this Telegram group may change content.
      ADMIN_GROUP_CHAT_ID: ${ADMIN_GROUP_CHAT_ID:-}
      # Channel the bot posts announcements to (bot must be its admin).
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      # Partnerships chat — partner applications are sent here. For a forum
      # topic (гілка) use "chatId/threadId", e.g. -1001234567890/12.
      PARTNERSHIP_CHAT_ID: ${PARTNERSHIP_CHAT_ID:-}
      # Department people-wall chats are configured in the admin panel
      # (Департаменти → Telegram chat ID), not via env.
      # Public origin of the web site, used to build event registration links.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      # Telegram usernames pinged on a new partner application.
      PARTNERSHIP_HEAD_TG: ${PARTNERSHIP_HEAD_TG:-}
      COUNCIL_HEAD_TG: ${COUNCIL_HEAD_TG:-}
      # Set to "true" to open write endpoints without Telegram auth (dev only).
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Where uploaded images are stored inside the container (persisted via volume).
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - fice_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: ./client/admin
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://server:3001
    container_name: fice-admin
    logging: *default-logging
    mem_limit: 512m
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Europe/Kyiv
      NODE_OPTIONS: --max-old-space-size=320
      # The /api-proxy rewrite runs inside this container, so it must reach the
      # backend via the compose service name — `localhost` would be the admin
      # container itself.
      BACKEND_URL: http://server:3001
    depends_on:
      - server

  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://server:3001
        NEXT_PUBLIC_USER_BOT_USERNAME: ${USER_BOT_USERNAME:-}
    container_name: fice-web
    logging: *default-logging
    mem_limit: 1g
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      TZ: Europe/Kyiv
      NODE_OPTIONS: --max-old-space-size=640
      # Internal URL for server-side (SSR/RSC) data fetches on the compose network.
      INTERNAL_API_URL: http://server:3001
      BACKEND_URL: http://server:3001
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: fice-caddy
    logging: *default-logging
    mem_limit: 256m
    profiles: ["prod"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD

volumes:
  fice_pg_data:
  fice_uploads:
  caddy_data:
  caddy_config:
